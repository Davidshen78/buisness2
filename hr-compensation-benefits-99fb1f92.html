<script>const CAT_DATA = {"uk":[{"id":101,"category":"Компенсації та пільги","icon":"💰","title":"Розробка політики · Компенсації та пільги","description":"Практичний сценарій для ситуації «розробка політики».","prompt":"Ти — директор з персоналу. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Розробка політики · Компенсації та пільги»\n\nВхідні дані:\n• Компанія/галузь: [вкажіть]\n• Розмір команди/відділу: [вкажіть]\n• Посада співробітника (якщо стосується): [вкажіть]\n• Юрисдикція (країна/провінція): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета HR-менеджера: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Яка ринкова ставка для цієї позиції?\n2. Який бюджет доступний на компенсаційний пакет?\n3. Які пільги найбільше цінує цільова аудиторія кандидатів?\n4. Як забезпечити внутрішню справедливість оплати?\n5. Який ризик відтоку через неконкурентну оплату?\n6. Як пояснити структуру компенсації співробітнику?\n\nАЛГОРИТМ\n1. Відокрем факти від припущень.\n2. Визнач головну HR-проблему саме в цій ситуації.\n3. Назви 2-3 можливі причини та відсій слабкі.\n4. Побудуй практичний план дій.\n5. Сформуй готові формулювання для розмови чи документа.\n6. Визнач ризики та юридичні наслідки.\n7. Дай конкретний наступний крок із рекомендованим строком.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/документа.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи персональні дані співробітників. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":102,"category":"Компенсації та пільги","icon":"💰","title":"Юридичний ризик · Компенсації та пільги","description":"Практичний сценарій для ситуації «юридичний ризик».","prompt":"Ти — HR-консультант. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Юридичний ризик · Компенсації та пільги»\n\nВхідні дані:\n• Компан
