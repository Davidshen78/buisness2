const PRODUCTS = [{"id": "sales", "icon": "💼", "entry": "sales-hub-180c0e7e.html", "price": "€29", "prompts": 372, "categories": 12, "name": {"uk": "AI Sales Machine", "en": "AI Sales Machine", "es": "AI Sales Machine", "de": "AI Sales Machine"}, "tagline": {"uk": "Пошук клієнтів, переговори, заперечення, закриття угод.", "en": "Prospecting, negotiation, objections, closing deals.", "es": "Prospección, negociación, objeciones, cierre de ventas.", "de": "Kundenakquise, Verhandlung, Einwände, Abschluss."}}, {"id": "hr", "icon": "🧭", "entry": "hr-hub-99fb1f92.html", "price": "€29", "prompts": 280, "categories": 14, "name": {"uk": "AI HR Machine", "en": "AI HR Machine", "es": "AI HR Machine", "de": "AI HR Machine"}, "tagline": {"uk": "Рекрутинг, відбір, компенсації, продуктивність, конфлікти.", "en": "Recruiting, selection, compensation, performance, conflicts.", "es": "Reclutamiento, selección, compensación, desempeño, conflictos.", "de": "Rekrutierung, Auswahl, Vergütung, Leistung, Konflikte."}}, {"id": "finance", "icon": "💰", "entry": "fin-hub-d259f352.html", "price": "€29", "prompts": 280, "categories": 14, "name": {"uk": "AI Finance Machine", "en": "AI Finance Machine", "es": "AI Finance Machine", "de": "AI Finance Machine"}, "tagline": {"uk": "Бюджетування, грошові потоки, звітність за МСФЗ, M&A.", "en": "Budgeting, cash flow, IFRS reporting, M&A.", "es": "Presupuestos, flujo de caja, informes NIIF, M&A.", "de": "Budgetierung, Cashflow, IFRS-Berichterstattung, M&A."}}, {"id": "marketing", "icon": "📱", "entry": "mkt-hub-74edd7dc.html", "price": "€29", "prompts": 280, "categories": 14, "name": {"uk": "AI Marketing Machine", "en": "AI Marketing Machine", "es": "AI Marketing Machine", "de": "AI Marketing Machine"}, "tagline": {"uk": "SEO, платна реклама, email, брендинг, PR, CRO.", "en": "SEO, paid ads, email, branding, PR, CRO.", "es": "SEO, publicidad, email, branding, RR. PP., CRO.", "de": "SEO, Werbung, E-Mail, Branding, PR, CRO."}}, {"id": "pm", "icon": "🚩", "entry": "pm-hub-c1edc41d.html", "price": "€29", "prompts": 280, "categories": 14, "name": {"uk": "AI PM Machine", "en": "AI PM Machine", "es": "AI PM Machine", "de": "AI PM Machine"}, "tagline": {"uk": "Ризики, розклад, бюджет, команда, Agile та Scrum.", "en": "Risk, schedule, budget, team, Agile and Scrum.", "es": "Riesgos, cronograma, presupuesto, equipo, Ágil y Scrum.", "de": "Risiko, Zeitplan, Budget, Team, Agile und Scrum."}}, {"id": "strategy", "icon": "🎯", "entry": "strat-hub-4c8520bc.html", "price": "€49", "prompts": 280, "categories": 14, "name": {"uk": "AI Strategy Machine", "en": "AI Strategy Machine", "es": "AI Strategy Machine", "de": "AI Strategy Machine"}, "tagline": {"uk": "Для C-level: рада директорів, M&A, трансформація.", "en": "For C-level: board governance, M&A, transformation.", "es": "Para C-level: consejo, M&A, transformación.", "de": "Für C-Level: Aufsichtsrat, M&A, Transformation."}}];
const LANG_ORDER = ["uk", "en", "es", "de"];

function getLang(){
  const p = new URLSearchParams(location.search).get('lang');
  return (p && UI[p]) ? p : (localStorage.getItem('suite_lang') || 'uk');
}

async function buyStub(productId){
  const lang = getLang();
  const u = UI[lang];
  const t = document.getElementById('toast');
  const product = PRODUCTS.find(p => p.id === productId);
  const label = product ? product.name[lang] : productId;

  let message = u.buy_stub + ' — ' + label;
  try {
    const resp = await fetch('/api/checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ productId, lang })
    });
    const data = await resp.json();
    if (data && data.checkoutUrl) {
      location.href = data.checkoutUrl; // real payment, once connected
      return;
    }
    if (data && data.message) message = data.message;
  } catch (e) {
    // API unreachable (e.g. static preview without serverless functions) —
    // fall back silently to the local "coming soon" toast.
  }

  t.textContent = message;
  t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.style.transform = 'translateX(-50%) translateY(100px)'; }, 2500);
}

function setLang(lang){
  if(!UI[lang]) return;
  localStorage.setItem('suite_lang', lang);
  const u = UI[lang];
  document.getElementById('heroBadge').textContent = u.badge;
  document.getElementById('heroH1').innerHTML = u.h1;
  document.getElementById('heroP').textContent = u.hero_p;
  document.getElementById('productsGrid').innerHTML = PRODUCTS.map(p => `
    <div class="card product-card">
      <div class="pc-top"><b>${p.icon} ${p.name[lang]}</b><span class="pc-price">${p.price}</span></div>
      <span>${p.tagline[lang]}</span>
      <span class="pc-meta">${p.prompts} ${u.prompts_label} · ${p.categories} ${u.categories_label}</span>
      <button class="pc-buy" onclick="buyStub('${p.id}')">${u.buy_btn} ${p.price}</button>
    </div>
  `).join('');
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  document.documentElement.lang = lang;
}
setLang(getLang());
</script>
