let lang='uk',activeLib='all',demoIndex=0, current=null;
const $=id=>document.getElementById(id);
function setText(){
 const t=UI[lang]; ['badge','hero','sub','once','demoBtn','demoTitle','demoText','libsTitle','privateNote','allBtn','appTitle','appSub','search','back','copy','download'].forEach(k=>{if($(k))$(k).textContent=t[k]});
 document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
 renderLibs(); renderSide(); render();
}
function renderLibs(){
 const icons={pm:'📐',sales:'🤝',marketing:'📣',lead:'🧭',ops:'⚙️',strategy:'♟️'};
 $('libs').innerHTML=Object.keys(LIBNAMES[lang]).map(k=>`<article class="lib" onclick="openLib('${k}')"><strong>${icons[k]} ${LIBNAMES[lang][k]}</strong><p>${RECORDS.filter(r=>r.language===lang&&r.library===k).length} ${lang==='uk'?'готових сценаріїв':lang==='de'?'fertige Szenarien':lang==='es'?'escenarios listos':'ready-to-use scenarios'}</p></article>`).join('');
}
function renderSide(){
 $('side').innerHTML=Object.keys(LIBNAMES[lang]).map(k=>`<button class="${activeLib===k?'on':''}" onclick="openLib('${k}')">${LIBNAMES[lang][k]}</button>`).join('');
 $('allBtn').classList.toggle('on',activeLib==='all');
}
function openLib(k){activeLib=k;$('landing').classList.add('hide');$('app').classList.add('open');renderSide();render();}
function back(){activeLib='all';$('app').classList.remove('open');$('landing').classList.remove('hide');renderSide();}
function render(){
 const q=$('search').value.trim().toLowerCase();
 let arr=RECORDS.filter(r=>r.language===lang&&(activeLib==='all'||r.library===activeLib));
 if(q)arr=arr.filter(r=>(r.title+' '+r.description+' '+r.situation+' '+r.prompt).toLowerCase().includes(q));
 $('count').textContent=`${UI[lang].show}: ${arr.length}`;
 $('prompts').innerHTML=arr.map(r=>`<article class="prompt" onclick="showPrompt('${r.id}')"><small>${LIBNAMES[lang][r.library]}</small><h3>${escapeHtml(r.title)}</h3><p>${escapeHtml(r.description)}</p></article>`).join('');
}
function showPrompt(id){
 current=RECORDS.find(r=>r.id===id); if(!current)return;
 $('modalTitle').textContent=current.title;$('modalDesc').textContent=current.description;$('modalPrompt').textContent=current.prompt;$('modal').classList.add('show');
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function closeModal(){$('modal').classList.remove('show')}
async function copyPrompt(){if(!current)return;await navigator.clipboard.writeText(current.prompt);$('copy').textContent=UI[lang].copied;setTimeout(()=>$('copy').textContent=UI[lang].copy,1400)}
function downloadPrompt(){if(!current)return;const text=`${current.title}\n\n${current.description}\n\n${current.prompt}`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=current.id+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function openDemo(){
 const choices=RECORDS.filter(r=>r.language===lang&&['pm','sales','strategy'].includes(r.library));
 const r=choices[Math.floor(Math.random()*choices.length)];
 $('demoCard').innerHTML=`<strong>${escapeHtml(r.title)}</strong><span>${escapeHtml(r.description)}</span><div style="margin-top:10px"><button class="btn primary" onclick="showPrompt('${r.id}')">${UI[lang].copy.replace('📋','')} →</button></div>`;
}
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{lang=b.dataset.l;setText();openDemo()});
$('demoBtn').onclick=openDemo;$('back').onclick=back;$('close').onclick=closeModal;$('copy').onclick=copyPrompt;$('download').onclick=downloadPrompt;$('search').oninput=render;
$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};
setText();openDemo();
</script>
