<script>const CAT_DATA = {"uk":[{"id":261,"category":"Фінансова стратегія","icon":"🎯","title":"Розробка політики · Фінансова стратегія","description":"Практичний сценарій для ситуації «розробка політики».","prompt":"Ти — фінансовий директор. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Розробка політики · Фінансова стратегія»\nКомпанія зросла з 15 до 60 співробітників за 18 місяців, а формальної фінансової політики (авторизація витрат, ліміти закупівель) досі немає. Керівництво хоче впровадити базові правила до кінця кварталу, не паралізувавши поточні процеси.\n\nВхідні дані:\n• Компанія/галузь: [вкажіть]\n• Розмір бізнесу (виручка/команда): [вкажіть]\n• Валюта звітності: [вкажіть]\n• Застосовний стандарт обліку (МСФЗ/GAAP): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета фінансового менеджера: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, як фінансове рішення підтримує довгострокову стратегію компанії?\n2. Який компроміс між зростанням і прибутковістю тут присутній?\n3. Яка альтернативна стратегія розподілу капіталу існує?\n4. Хто з керівництва має бути залучений до рішення?\n5. Який показник підтвердить успіх стратегії за рік?\n6. Який ризик для стратегії, якщо ринкові умови зміняться?\n\nАЛГОРИТМ\n1. Відокрем факти від припущень.\n2. Визнач головну мету цього рішення в контексті довгострокової стратегії.\n3. Розглянь 2-3 альтернативні підходи та оціни їх компроміси.\n4. Побудуй поетапний план впровадження з контрольними точками.\n5. Визнач ресурси (бюджет, люди, час), потрібні для реалізації.\n6. Оціни ризики та передумови успіху.\n7. Дай конкретний перший крок із рекомендованим строком.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/документа.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи фінансові дані компанії. Спирайся на загальновизнані міжнародні стандарти (МСФЗ/IFRS) там, де це релевантно, а не на законодавство конкретної країни. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":262,"category":"Фінансова стратегія","icon":"🎯","title":"Комплаєнс-ризик · Фінансова стратегія","description":"Практичний сценарій для ситуації «комплаєнс-ризик».","prompt":"Ти — фінансовий консультант. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Комплаєнс-ризик · Фінансова стратегія»\nПід час підготовки до аудиту виявлено, що частина операцій за останні 6 місяців не має належного документального підтвердження. Строк подання звітності — 3 тижні.\n\nВхідні дані:\n• Компанія/галузь: [вкажіть]\n• Розмір бізнесу (виручка/команда): [вкажіть]\n• Валюта звітності: [вкажіть]\n• Застосовний стандарт обліку (МСФЗ/GAAP): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета фінансового менеджера: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, як фінансове рішення підтримує довгострокову стратегію компанії?\n2. Який компроміс між зростанням і прибутковістю тут присутній?\n3. Яка альтернативна стратегія розподілу капіталу існує?\n4. Хто з керівництва має бути залучений до рішення?\n5. Який показник підтвердить успіх стратегії за рік?\n6. Який ризик для стратегії, якщо ринкові умови зміняться?\n\nАЛГОРИТМ\n1. Визнач застосовний стандарт чи вимогу (МСФЗ, внутрішня політика).\n2. Оціни масштаб та строк усунення невідповідності.\n3. Задокументуй факти до того, як пропонувати рішення.\n4. Визнач, хто має бути залучений для перевірки чи підтвердження.\n5. Сформуй план усунення з чіткими строками.\n6. Оціни ризик, якщо невідповідність не буде усунена вчасно.\n7. Запропонуй превентивний захід, щоб уникнути повторення.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/документа.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи фінансові дані компанії. Спирайся на загальновизнані міжнародні стандарти (МСФЗ/IFRS) там, де це релевантно, а не на законодавство конкретної країни. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":263,"category":"Фінансова стратегія","icon":"🎯","title":"Складна розмова зі стейкхолдером · Фінансова стратегія","description":"Практичний сценарій для ситуації «складна розмова зі стейкхолдером».","prompt":"Ти — керівник фінансового відділу. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Складна розмова зі стейкхолдером · Фінансова стратегія»\nМажоритарний інвестор вимагає пояснень, чому фактичний прибуток за квартал на 22% нижчий за прогноз, і натякає на перегляд умов фінансування.\n\nВхідні дані:\n• Компанія/галузь: [вкажіть]\n• Розмір бізнесу (виручка/команда): [вкажіть]\n• Валюта звітності: [вкажіть]\n• Застосовний стандарт обліку (МСФЗ/GAAP): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета фінансового менеджера: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, як фінансове рішення підтримує довгострокову стратегію компанії?\n2. Який компроміс між зростанням і прибутковістю тут присутній?\n3. Яка альтернативна стратегія розподілу капіталу існує?\n4. Хто з керівництва має бути залучений до рішення?\n5. Який показник підтвердить успіх стратегії за рік?\n6. Який ризик для стратегії, якщо ринкові умови зміняться?\n\nАЛГОРИТМ\n1. Визнач, що стейкхолдер насправді хоче почути чи отримати.\n2. Відокрем факти від емоційної реакції в ситуації.\n3. Сформуй повідомлення, яке визнає стурбованість і дає конкретну відповідь.\n4. Підготуй дані чи докази, що підтверджують позицію.\n5. Визнач межу поступок, прийнятну для компанії.\n6. Сформуй готовий текст для розмови чи листа.\n7. Визнач наступний крок і спосіб підтримати довіру після розмови.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/документа.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи фінансові дані компанії. Спирайся на загальновизнані міжнародні стандарти (МСФЗ/IFRS) там, де це релевантно, а не на законодавство конкретної країни. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":264,"category":"Фінансова стратегія","icon":"🎯","title":"Бюджетне обмеження · Фінансова стратегія","description":"Практичний сценарій для ситуації «бюджетне обмеження».","prompt":"Ти — бізнес-аналітик. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Бюджетне обмеження · Фінансова стратегія»\nЗатверджений бюджет на маркетинг вичерпано на 80% вже в середині кварталу, а керівник відділу просить додаткові 15 000 EUR на кампанію, яка мала розпочатися минулого тижня.\n\nВхідні дані:\n• Компанія/галузь: [вкажіть]\n• Розмір бізнесу (виручка/команда): [вкажіть]\n• Валюта звітності: [вкажіть]\n• Застосовний стандарт обліку (МСФЗ/GAAP): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета фінансового менеджера: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, як фінансове рішення підтримує довгострокову стратегію компанії?\n2. Який компроміс між зростанням і прибутковістю тут присутній?\n3. Яка альтернативна стратегія розподілу капіталу існує?\n4. Хто з керівництва має бути залучений до рішення?\n5. Який показник підтвердить успіх стратегії за рік?\n6. Який ризик для стратегії, якщо ринкові умови зміняться?\n\nАЛГОРИТМ\n1. Зафіксуй точні цифри ситуації — суми, дати, терміни.\n2. Визнач мінімально необхідну дію для стабілізації протягом 24-48 годин.\n3. Оціни, кого потрібно негайно поінформувати.\n4. Визнач тимчасові заходи, які можна скасувати після стабілізації.\n5. Сформуй короткий план дій без зайвих деталей.\n6. Визнач, який показник підтвердить, що криза минула.\n7. Заплануй розбір ситуації після стабілізації, щоб запобігти повторенню.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. рдить успіх стратегії за рік?\n6. Який ризик для стратегії, якщо ринкові умови зміняться?\n\nАЛГОРИТМ\n1. Визнач, які дані підтверджують чи спростовують проблему.\n2. Розклади показник на складові частини, щоб знайти джерело відхилення.\n3. Порівняй поточні дані з історичними чи галузевими бенчмарками.\n4. Сформулюй 2-3 гіпотези щодо причини та перевір кожну.\n5. Визнач, яка гіпотеза найкраще пояснює дані.\n6. Запропонуй конкретну дію на основі підтвердженої причини.\n7. Визнач, який показник відстежувати, щоб підтвердити ефект дії.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/документа.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи фінансові дані компанії. Спирайся на загальновизнані міжнародні стандарти (МСФЗ/IFRS) там, де це релевантно, а не на законодавство конкретної країни. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":273,"category":"Фінансова стратегія","icon":"🎯","title":"Рішення щодо банку чи постачальника · Фінансова стратегія","description":"Практичний сценарій для ситуації «рішення щодо банку чи постачальника».","prompt":"Ти — фінансовий директор. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Рішення щодо банку чи постачальника · Фінансова стратегія»\nПоточний банк підвищив комісію за обслуговування на 40%, і потрібно вирішити, чи варто міняти банківського партнера за 2 місяці до кінця контракту.\n\nВхідні дані:\n• Компанія/галузь: [вкажіть]\n• Розмір бізнесу (виручка/команда): [вкажіть]\n• Валюта звітності: [вкажіть]\n• Застосовний стандарт обліку (МСФЗ/GAAP): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета фінансового менеджера: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, як фінансове рішення підтримує довгострокову стратегію компанії?\n2. Який компроміс між зростанням і прибутковістю тут присутні \n• Розмір бізнесу (виручка/команда): [вкажіть]\n• Валюта звітності: [вкажіть]\n• Застосовний стандарт обліку (МСФЗ/GAAP): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета фінансового менеджера: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, як фінансове рішення підтримує довгострокову стратегію компанії?\n2. Який компроміс між зростанням і прибутковістю тут присутній?\n3. Яка альтернативна стратегія розподілу капіталу існує?\n4. Хто з керівництва має бути залучений до рішення?\n5. Який показник підтвердить успіх стратегії за рік?\n6. Який ризик для стратегії, якщо ринкові умови зміняться?\n\nАЛГОРИТМ\n1. Визнач застосовний стандарт чи вимогу (МСФЗ, внутрішня політика).\n2. Оціни масштаб та строк усунення невідповідності.\n3. Задокументуй факти до того, як пропонувати рішення.\n4. Визнач, хто має бути залучений для перевірки чи підтвердження.\n5. Сформуй план усунення з чіткими строками.\n6. Оціни ризик, якщо невідповідність не буде усунена вчасно.\n7. Запропонуй превентивний захід, щоб уникнути повторення.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/документа.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи фінансові дані компанії. Спирайся на загальновизнані міжнародні стандарти (МСФЗ/IFRS) там, де це релевантно, а не на законодавство конкретної країни. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."}],"en":[{"id":261,"category":"Financial Strategy","icon":"🎯","title":"Policy design · Financial Strategy","description":"A practical scenario for the situation \"policy design\".","prompt":"You are a Chief Financial Officer. Work like a practitioner, not like a writer of generic advice.\n\nSCENARIO\n\"Policy design · Financial Strategy\"\nThe company grew from 15 to 60 employees in 18 months, and there is still no formal financial policy (spend authorization, procurement limits). Leadership wants basic rules in place by the end of the quarter without paralyzing current processes.\n\nInput data:\n• Company/industry: [specify]\n• Business size (revenue/team): [specify]\n• Reporting currency: [specify]\n• Applicable accounting standard (IFRS/GAAP): [specify]\n• Current stage of the situation: [specify]\n• Known facts: [specify]\n• Financial manager's goal: [specify]\n\nQUESTIONS FOR THIS SCENARIO\n1. Given this situation, how does the financial decision support the company's long-term strategy?\n2. What trade-off between growth and profitability is present here?\n3. What alternative capital allocation strategy exists?\n4. Which leader needs to be involved in the decision?\n5. What metric will confirm the strategy's success within a year?\n6. What risk does the strategy face if market conditions change?\n\nALGORITHM\n1. Separate facts from assumptions.\n2. Identify the main goal of this decision within the long-term strategy.\n3. Consider 2-3 alternative approaches and weigh their trade-offs.\n4. Build a phased implementation plan with checkpoints.\n5. Identify the resources (budget, people, time) needed for execution.\n6. Assess the risks and preconditions for success.\n7. Give a concrete first step with a recommended deadline.\n\nRESULT FORMAT\nA. Diagnosis.\nB. Answers to key questions.\nC. Recommended action plan.\nD. Ready-made conversation/document text.\nE. What not to do.\nF. Next step.\nG. Success criteria.\n\nDon't invent facts, figures, or company financial data. Rely on generally accepted international standards (IFRS) where relevant, not on any single country's legislation. If data is missing, ask up to 5 clarifying questions before making a final recommendation."},{"id":262,"category":"Financial Strategy","icon":"🎯","title":"Compliance risk · Financial Strategy","description":"A practical scenario for the situation \"compliance risk\".","prompt":"You are a Financial Consultant. Work like a practitioner, not like a writer of generic advice.\n\nSCENARIO\n\"Compliance risk · Financial Strategy\"\nWhile preparing for the audit, some transactions from the last 6 months were found to lack proper supporting documentation. The reporting deadline is in 3 weeks.\n\nInput data:\n• Company/industry: [specify]\n• Business size (revenue/team): [specify]\n• Reporting currency: [specify]\n• Applicable accounting standard (IFRS/GAAP): [specify]\n• Current stage of the situation: [specify]\n• Known facts: [specify]\n• Financial manager's goal: [specify]\n\nQUESTIONS FOR THIS SCENARIO\n1. Given this situation, how does the financial decision support the company's long-term strategy?\n2. What trade-off between growth and profitability is present here?\n3. What alternative capital allocation strategy exists?\n4. Which leader needs to be involved in the decision?\n5. What metric will confirm the strategy's success within a year?\n6. What risk does the strategy face if market conditions change?\n\nALGORITHM\n1. Identify the applicable standard or requirement (IFRS, internal policy).\n2. Assess the scope and deadline for resolving the non-compliance.\n3. Document the facts before proposing a solution.\n4. Identify who needs to be involved to verify or confirm it.\n5. Build a remediation plan with clear deadlines.\n6. Assess the risk if the non-compliance isn't resolved in time.\n7. Propose a preventive measure to avoid recurrence.\n\nRESULT FORMAT\nA. Diagnosis.\nB. Answers to key questions.\nC. Recommended action plan.\nD. Ready-made conversation/document text.\nE. What not to do.\nF. Next step.\nG. Success criteria.\n\nDon't invent facts, figures, or company financial data. Rely on generally accepted international standards (IFRS) where relevant, not on any single country's legislation. If data is missing, ask up to 5 clarifying questions before making a final recommendation."},{"id":263,"category":"Financial Strategy","icon":"🎯","title":"Difficult conversation with a stakeholder · Financial Strategy","description":"A practical scenario for the situation \"difficult conversation with a stakeholder\".","prompt":"You are the Head of Finance. Work like a practitioner, not like a writer of generic advice.\n\nSCENARIO\n\"Difficult conversation with a stakeholder · Financial Strategy\"\nThe majority investor is demanding an explanation for why actual quarterly profit came in 22% below forecast, and is hinting at revisiting the financing terms.\n\nInput data:\n• Company/industry: [specify]\n• Business size (revenue/team): [specify]\n• Reporting currency: [specify]\n• Applicable accounting standard (IFRS/GAAP): [specify]\n• Current stage of the situation: [specify]\n• Known facts: [specify]\n• Financial manager's goal: [specify]\n\nQUESTIONS FOR THIS SCENARIO\n1. Given this situation, how does the financial decision support the company's long-term strategy?\n2. What trade-off between growth and profitability is present here?\n3. What alternative capital allocation strategy exists?\n4. Which leader needs to be involved in the decision?\n5. What metric will confirm the strategy's success within a year?\n6. What risk does the strategy face if market conditions change?\n\nALGORITHM\n1. Identify what the stakeholder actually wants to hear or receive.\n2. Separate the facts from the emotional reaction in the situation.\n3. Draft a message that acknowledges the concern and gives a concrete answer.\n4. Prepare the data or evidence that supports the position.\n5. Identify the limit of concessions acceptable to the company.\n6. Draft ready-to-use text for the conversation or letter.\n7. Identify the next step and how to maintain trust afterward.\n\nRESULT FORMAT\nA. Diagnosis.\nB. Answers to key questions.\nC. Recommended action plan.\nD. Ready-made conversation/document text.\nE. What not to do.\nF. Next step.\nG. Success criteria.\n\nDon't invent facts, figures, or company financial data. Rely on generally accepted international standards (IFRS) where relevant, not on any single country's legislation. If data is missing, ask up to 5 clarifying questions before making a final recommendation."},{"id":264,"category":"Financial Strategy","icon":"🎯","title":"Budget constraint · Financial Strategy","description":"A practical scenario for the situation \"budget constraint\".","prompt":"You are a Business Analyst. Work like a practitioner, not like a writer of generic advice.\n\nSCENARIO\n\"Budget constraint · Financial Strategy\"\nThe approved marketing budget is already 80% spent by mid-quarter, and the department head is requesting an additional €15,000 for a campaign that was supposed to launch last week.\n\nInput data:\n• Company/industry: [specify]\n• Business size (revenue/team): [specify]\n• Reporting currency: [specify]\n• Applicable accounting standard (IFRS/GAAP): [specify]\n• Current stage of the situation: [specify]\n• Known facts: [specify]\n• Financial manager's goal: [specify]\n\nQUESTIONS FOR THIS SCENARIO\n1. Given this situation, how does the financial decision support the company's long-term strategy?\n2. What trade-off between growth and profitability is present here?\n3. What alternative capital allocation strategy exists?\n4. Which leader needs to be involved in the decision?\n5. What metric will confirm the strategy's success within a year?\n6. What risk does the strategy face if market conditions change?\n\nALGORITHM\n1. Record the exact figures of the situation — amounts, dates, deadlines.\n2. Identify the minimum action needed to stabilize within 24-48 hours.\n3. Assess who needs to be informed immediately.\n4. Identify temporary measures that can be reversed once stabilized.\n5. Draft a short action plan without unnecessary detail.\n6. Identify the metric that will confirm the crisis has passed.\n7. Schedule a post-mortem after stabilization to prevent recurrence.\n\nRESULT FORMAT\nA. Diagnosis.\nB. Answers to key questions.\nC. Recommended action plan.\nD. Ready-made conversation/document text.\nE. What not to do.\nF. Next step.\nG. Success criteria.\n\nDon't invent facts, figures, or company financial data. Rely on generally accepted international standards (IFRS) where relevant, not on any single country's legislation. If data is missing, ask up to 5 clarifying questions before making a final recommendation."},{"id":265,"category":"Financial Strategy","icon":"🎯","title":"New process implementation · Financial Strategy","description":"A practical scenario for the situation \"new process implementation\".","prompt":"You are a Chief Financial Officer. Work like a practitioner, not like a writer of generic advice.\n\nSCENARIO\n\"New process implementation · Financial Strategy\"\nThe company is moving from manual Excel bookkeeping to an ERP system. The transition must be completed in 6 weeks, and the finance team has only 3 people.\n\nInput data:\n• Company/industry: [specify]\n• Business size (revenue/team): [specify]\n• Reporting currency: [specify]\n• Applicable accounting standard (IFRS/GAAP): [specify]\n• Current stage of the situation: [specify]\n• Known facts: [specify]\n• Financial manager's goal: [specify]\n\nQUESTIONS FOR THIS SCENARIO\n1. Given this situation, how does the financial decision support the company's long-term strategy?\n2. What trade-off between growth and profitability is present here?\n3. What alternative capital allocation strategy exists?\n4. Which leader needs to be involved in the decision?\n5. What metric will confirm the strategy's success within a year?\n6. What risk does the strategy face if market conditions change?\n\nALGORITHM\n1. Separate facts from assumptions.\n2. Identify the main goal of this decision within the long-term strategy.\n3. Consider 2-3 alternative approaches and weigh their trade-offs.\n4. Build a phased implementation plan with checkpoints.\n5. Identify the resources (budget, people, time) needed for execution.\n6. Assess the risks and preconditions for success.\n7. Give a concrete first step with a recommended deadline.\n\nRESULT FORMAT\nA. Diagnosis.\nB. Answers to key questions.\nC. Recommended action plan.\nD. Ready-made conversation/document text.\nE. What not to do.\nF. Next step.\nG. Success criteria.\n\nDon't invent facts, figures, or company financial data. Rely on generally accepted international standards (IFRS) where relevant, not on any single country's legislation. If data is missing, ask up to 5 clarifying questions before making a final recommendation."},{"id":266,"category":"Financial Strategy","icon":"🎯","title":"Need for an analytical tool · Financial Strategy","description":"A practical scenario for the situation \"need for an analytical tool\".","prompt":"You are a Financial Consultant. Work like a practitioner, not like a writer of generic advice.\n\nSCENARIO\n\"Need for an analytical tool · Financial Strategy\"\nLeadership requests updated metrics every week, but manually gathering them takes one analyst 8 hours a week.\n\nInput data:\n• Company/industry: [specify]\n• Business size (revenue/team): [specify]\n• Reporting currency: [specify]\n• Applicable accounting standard (IFRS/GAAP): [specify]\n• Current stage of the situation: [specify]\n• Known facts: [specify]\n• Financial manager's goal: [specify]\n\nQUESTIONS FOR THIS SCENARIO\n1. Given this situation, how does the financial decision support the company's long-term strategy?\n2. What trade-off between growth and profitability is present here?\n3. What alternative capital allocation strategy exists?\n4. Which leader needs to be involved in the decision?\n5. What metric will confirm the strategy's success within a year?\n6. What risk does the strategy face if market conditions change?\n\nALGORITHM\n1. Identify what data confirms or disproves the problem.\n2. Break the metric down into components to find the source of the deviation.\n3. Compare current data against historical or industry benchmarks.\n4. Formulate 2-3 hypotheses about the cause and test each one.\n5. Determine which hypot
