<script>const CAT_DATA = {"uk":[{"id":141,"category":"Інфлюенс-маркетинг та партнерства","icon":"🤳","title":"Розробка стратегії · Інфлюенс-маркетинг та партнерства","description":"Практичний сценарій для ситуації «розробка стратегії».","prompt":"Ти — директор з маркетингу. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Розробка стратегії · Інфлюенс-маркетинг та партнерства»\nКомпанія виходить на новий сегмент аудиторії, але контент-план і канали досі не визначені. Керівництво хоче бачити стратегію на квартал уже наступного тижня.\n\nВхідні дані:\n• Продукт/бренд: [вкажіть]\n• Цільова аудиторія: [вкажіть]\n• Канал/платформа: [вкажіть]\n• Бюджет (якщо застосовно): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета маркетолога: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, яка цільова аудиторія інфлюенсера відповідає нашій?\n2. Який формат співпраці (пост, огляд, амбасадорство) підходить?\n3. Яка вартість та очікуваний ROI співпраці?\n4. Як перевірити автентичність аудиторії інфлюенсера?\n5. Які умови контракту потрібно чітко прописати?\n6. Як виміряти результат цієї колаборації?\n\nАЛГОРИТМ\n1. Відокрем факти від припущень.\n2. Визнач головну мету цього рішення в контексті довгострокової стратегії.\n3. Розглянь 2-3 альтернативні підходи та оціни їх компроміси.\n4. Побудуй поетапний план впровадження з контрольними точками.\n5. Визнач ресурси (бюджет, люди, час), потрібні для реалізації.\n6. Оціни ризики та передумови успіху.\n7. Дай конкретний перший крок із рекомендованим строком.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/матеріалу.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи дані про аудиторію компанії. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":142,"category":"Інфлюенс-маркетинг та партнерства","icon":"🤳","ti гноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/матеріалу.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи дані про аудиторію компанії. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."}],"en":[{"id":141,"category":"Influencer Marketing & Partnerships","icon":"🤳","title":"Strategy design · Influencer Marketing & Partnerships","description":"A practical scenario for the situation \"strategy design\".","prompt":"You are a Chief Marketing Officer. Work like a practitioner, not like a writer of generic advice.\n\nSCENARIO\n\"Strategy design · Influencer Marketing & Partnerships\"\nThe company is entering a new audience segment, but the content plan and channels are still undefined. Leadership wants to see a quarterly strategy by next week.\n\nInput data:\n• Product/brand: [specify]\n• Target audience: [specify]\n• Channel/platform: [specify]\n• Budget (if applicable): [specify]\n• Current stage of the situation: [specify]\n• Known facts: [specify]\n• Marketer's goal: [specify]\n\nQUESTIONS FOR THIS SCENARIO\n1. Given this situation, how well does the influencer's audience match ours?\n2. What collaboration format (post, review, ambassadorship) fits?\n3. What is the cost and expected ROI of the collaboration?\n4. How to verify the authenticity of the influencer's audience?\n5. What contract terms need to be clearly spelled out?\n6. How should the result of this collaboration be measured?\n\nALGORITHM\n1. Separate facts from assumptions.\n2. Identify the main goal of this decision within the long-term strategy.\n3. Consider 2-3 alternative approaches and weigh their trade-offs.\n4. Build a phased implementation plan with checkpoints.\n5. Identify the resources (budget, people, time) needed for execution.\n6. Assess the risks and preconditions for success.\n7. Give a concrete first step with a recommended deadline.\n\nRESULT FORMAT\nA.
