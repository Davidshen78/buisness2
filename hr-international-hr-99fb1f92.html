<script>const CAT_DATA = {"uk":[{"id":261,"category":"Міжнародний HR","icon":"🌐","title":"Розробка політики · Міжнародний HR","description":"Практичний сценарій для ситуації «розробка політики».","prompt":"Ти — директор з персоналу. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Розробка політики · Міжнародний HR»\n\nВхідні дані:\n• Компанія/галузь: [вкажіть]\n• Розмір команди/відділу: [вкажіть]\n• Посада співробітника (якщо стосується): [вкажіть]\n• Юрисдикція (країна/провінція): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета HR-менеджера: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Яке законодавство країни перебування застосовується?\n2. Які культурні відмінності впливають на ситуацію?\n3. Який валютний чи податковий фактор потрібно врахувати?\n4. Хто локальний партнер чи консультант, до якого варто звернутися?\n5. Як адаптувати політику компанії під локальний контекст?\n6. Який ризик релокації чи візового статусу присутній?\n\nАЛГОРИТМ\n1. Відокрем факти від припущень.\n2. Визнач головну HR-проблему саме в цій ситуації.\n3. Назви 2-3 можливі причини та відсій слабкі.\n4. Побудуй практичний план дій.\n5. Сформуй готові формулювання для розмови чи документа.\n6. Визнач ризики та юридичні наслідки.\n7. Дай конкретний наступний крок із рекомендованим строком.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/документа.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи персональні дані співробітників. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":262,"category":"Міжнародний HR","icon":"🌐","title":"Юридичний ризик · Міжнародний HR","description":"Практичний сценарій для ситуації «юридичний ризик».","prompt":"Ти — HR-консультант. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Юридичний ризик · Міжнародний HR»\n\nВхідні дані:\n• Ком
