<script>const CAT_DATA = {"uk":[{"id":181,"category":"Управління продуктивністю","icon":"📈","title":"Розробка політики · Управління продуктивністю","description":"Практичний сценарій для ситуації «розробка політики».","prompt":"Ти — директор з персоналу. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Розробка політики · Управління продуктивністю»\n\nВхідні дані:\n• Компанія/галузь: [вкажіть]\n• Розмір команди/відділу: [вкажіть]\n• Посада співробітника (якщо стосується): [вкажіть]\n• Юрисдикція (країна/провінція): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета HR-менеджера: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Яка конкретна метрика показує проблему з продуктивністю?\n2. Це питання навичок, мотивації чи ресурсів?\n3. Який план покращення реалістичний для співробітника?\n4. Який строк для оцінки прогресу?\n5. Хто має бути залучений до розмови про продуктивність?\n6. Які наслідки, якщо покращення не відбудеться?\n\nАЛГОРИТМ\n1. Відокрем факти від припущень.\n2. Визнач головну HR-проблему саме в цій ситуації.\n3. Назви 2-3 можливі причини та відсій слабкі.\n4. Побудуй практичний план дій.\n5. Сформуй готові формулювання для розмови чи документа.\n6. Визнач ризики та юридичні наслідки.\n7. Дай конкретний наступний крок із рекомендованим строком.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/документа.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи персональні дані співробітників. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":182,"category":"Управління продуктивністю","icon":"📈","title":"Юридичний ризик · Управління продуктивністю","description":"Практичний сценарій для ситуації «юридичний ризик».","prompt":"Ти — HR-консультант. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Юридичний ризик · Управління продуктивністю»\n
