<script>const CAT_DATA = {"uk":[{"id":181,"category":"Управління спільнотою","icon":"💬","title":"Розробка стратегії · Управління спільнотою","description":"Практичний сценарій для ситуації «розробка стратегії».","prompt":"Ти — директор з маркетингу. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Розробка стратегії · Управління спільнотою»\nКомпанія виходить на новий сегмент аудиторії, але контент-план і канали досі не визначені. Керівництво хоче бачити стратегію на квартал уже наступного тижня.\n\nВхідні дані:\n• Продукт/бренд: [вкажіть]\n• Цільова аудиторія: [вкажіть]\n• Канал/платформа: [вкажіть]\n• Бюджет (якщо застосовно): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета маркетолога: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, яка поведінка спільноти зараз викликає занепокоєння чи інтерес?\n2. Який тон відповіді відповідає голосу бренду?\n3. Як швидко потрібно реагувати на цей тип коментарів?\n4. Яке правило модерації застосовується тут?\n5. Як перетворити активного учасника на амбасадора бренду?\n6. Який показник engagement відстежувати після цієї дії?\n\nАЛГОРИТМ\n1. Відокрем факти від припущень.\n2. Визнач головну мету цього рішення в контексті довгострокової стратегії.\n3. Розглянь 2-3 альтернативні підходи та оціни їх компроміси.\n4. Побудуй поетапний план впровадження з контрольними точками.\n5. Визнач ресурси (бюджет, люди, час), потрібні для реалізації.\n6. Оціни ризики та передумови успіху.\n7. Дай конкретний перший крок із рекомендованим строком.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/матеріалу.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи дані про аудиторію компанії. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":182,"category":"Управління спільнотою","icon":"💬","title":"Юридичний ризик реклами · Управління спільнотою","description":"Практичний сценарій для ситуації «юридичний ризик реклами».","prompt":"Ти — маркетинг-консультант. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Юридичний ризик реклами · Управління спільнотою»\nЮридичний відділ повідомив, що поточна рекламна кампанія містить формулювання, яке може порушувати правила реклами щодо порівняння з конкурентами.\n\nВхідні дані:\n• Продукт/бренд: [вкажіть]\n• Цільова аудиторія: [вкажіть]\n• Канал/платформа: [вкажіть]\n• Бюджет (якщо застосовно): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета маркетолога: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, яка поведінка спільноти зараз викликає занепокоєння чи інтерес?\n2. Який тон відповіді відповідає голосу бренду?\n3. Як швидко потрібно реагувати на цей тип коментарів?\n4. Яке правило модерації застосовується тут?\n5. Як перетворити активного учасника на амбасадора бренду?\n6. Який показник engagement відстежувати після цієї дії?\n\nАЛГОРИТМ\n1. Визнач застосовну вимогу (рекламне законодавство, правила платформи, внутрішня політика).\n2. Оціни масштаб та строк усунення невідповідності.\n3. Задокументуй факти до того, як пропонувати рішення.\n4. Визнач, хто має бути залучений для перевірки чи підтвердження (юрист, комплаєнс).\n5. Сформуй план усунення з чіткими строками.\n6. Оціни ризик, якщо невідповідність не буде усунена вчасно.\n7. Запропонуй превентивний захід, щоб уникнути повторення.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/матеріалу.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи дані про аудиторію компанії. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":183,"category":"Управління спільнотою","icon":"💬","title":"Складна розмова зі стейкхолдером · Управління спільнотою","description":"Практи н дій.\nГ. Готовий текст для розмови/матеріалу.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи дані про аудиторію компанії. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":198,"category":"Управління спільнотою","icon":"💬","title":"Компроміс охоплення і конверсії · Управління спільнотою","description":"Практичний сценарій для ситуації «компроміс охоплення і конверсії».","prompt":"Ти — маркетинг-консультант. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Компроміс охоплення і конверсії · Управління спільнотою»\nОдин канал дає найширше охоплення, але найнижчу конверсію (0.5%), а інший — вузьке охоплення з конверсією 6%. Бюджет дозволяє обрати лише один пріоритетно.\n\nВхідні дані:\n• Продукт/бренд: [вкажіть]\n• Цільова аудиторія: [вкажіть]\n• Канал/платформа: [вкажіть]\n• Бюджет (якщо застосовно): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета маркетолога: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, яка поведінка спільноти зараз викликає занепокоєння чи інтерес?\n2. Який тон відповіді відповідає голосу бренду?\n3. Як швидко потрібно реагувати на цей тип коментарів?\n4. Яке правило модерації застосовується тут?\n5. Як перетворити активного учасника на амбасадора бренду?\n6. Який показник engagement відстежувати після цієї дії?\n\nАЛГОРИТМ\n1. Визнач, які дані підтверджують чи спростовують проблему.\n2. Розклади показник на складові частини, щоб знайти джерело відхилення.\n3. Порівняй поточні дані з історичними чи галузевими бенчмарками.\n4. Сформулюй 2-3 гіпотези щодо причини та перевір кожну.\n5. Визнач, яка гіпотеза найкраще пояснює дані.\n6. Запропонуй конкретну дію на основі підтвердженої причини.\n7. Визнач, який показник відстежувати, щоб підтвердити ефект дії.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/матеріалу.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи дані про аудиторію компанії. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":199,"category":"Управління спільнотою","icon":"💬","title":"Міжвідділова координація · Управління спільнотою","description":"Практичний сценарій для ситуації «міжвідділова координація».","prompt":"Ти — керівник відділу маркетингу. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Міжвідділова координація · Управління спільнотою»\nВідділ продажів прогнозує зростання попиту на 40% через сезонність, а маркетинг ще не заклав бюджет на посилення реклами під цей період.\n\nВхідні дані:\n• Продукт/бренд: [вкажіть]\n• Цільова аудиторія: [вкажіть]\n• Канал/платформа: [вкажіть]\n• Бюджет (якщо застосовно): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета маркетолога: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, яка поведінка спільноти зараз викликає занепокоєння чи інтерес?\n2. Який тон відповіді відповідає голосу бренду?\n3. Як швидко потрібно реагувати на цей тип коментарів?\n4. Яке правило модерації застосовується тут?\n5. Як перетворити активного учасника на амбасадора бренду?\n6. Який показник engagement відстежувати після цієї дії?\n\nАЛГОРИТМ\n1. Визнач, що стейкхолдер насправді хоче почути чи отримати.\n2. Відокрем факти від емоційної реакції в ситуації.\n3. Сформуй повідомлення, яке визнає стурбованість і дає конкретну відповідь.\n4. Підготуй дані чи докази, що підтверджують позицію.\n5. Визнач межу поступок, прийнятну для компанії.\n6. Сформуй готовий текст для розмови чи листа.\n7. Визнач наступний крок і спосіб підтримати довіру після розмови.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/матеріалу.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи дані про аудиторію компанії. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":200,"category":"Управління спільнотою","icon":"💬","title":"Аудит і вдосконалення воронки · Управління спільнотою","description":"Практичний сценарій для ситуації «аудит і вдосконалення воронки».","prompt":"Ти — digital-маркетолог. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Аудит і вдосконалення воронки · Управління спільнотою»\nАудит воронки показав, що 60% користувачів залишають кошик на етапі оплати, а причина досі не з'ясована.\n\nВхідні дані:\n• Продукт/бренд: [вкажіть]\n• Цільова аудиторія: [вкажіть]\n• Канал/платформа: [вкажіть]\n• Бюджет (якщо застосовно): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета маркетолога: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, яка поведінка спільноти зараз викликає занепокоєння чи інтерес?\n2. Який тон відповіді відповідає голосу бренду?\n3. Як швидко потрібно реагувати на цей тип коментарів?\n4. Яке правило модерації застосовується тут?\n5. Як перетворити активного учасника на амбасадора бренду?\n6. Який показник engagement відстежувати після цієї дії?\n\nАЛГОРИТМ\n1. Визнач, які дані підтверджують чи спростовують проблему.\n2. Розклади показник на складові частини, щоб знайти джерело відхилення.\n3. Порівняй поточні дані з історичними чи галузевими бенчмарками.\n4. Сформулюй 2-3 гіпотези щодо причини та перевір кожну.\n5. Визнач, яка гіпотеза найкраще пояснює дані.\n6. Запропонуй конкретну дію на основі підтвердженої причини.\n7. Визнач, який показник відстежувати, щоб підтвердити ефект дії.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/матеріалу.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи дані про аудиторію компанії. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."}],"en":[{"id":181,"category":"Community Management","icon":"💬","title":"Strategy design · Community Management","description":"A practical scenario for the situation \"strategy design\".","prompt":"You are a Chief Marketing Officer. Work like a practitioner, not like a writer of generic advice.\n\nSCENARIO\n\"Strategy design · Community Management\"\nThe company is entering a new audience segment, but the content plan and channels are still undefined. Leadership wants to see a quarterly strategy by next week.\n\nInput data:\n• Product/brand: [specify]\n• Target audience: [specify]\n• Channel/platform: [specify]\n• Budget (if applicable): [specify]\n• Current stage of the situation: [specify]\n• Known facts: [specify]\n• Marketer's goal: [specify]\n\nQUESTIONS FOR THIS SCENARIO\n1. Given this situation, what community behavior is currently raising concern or interest?\n2. What response tone matches the brand voice?\n3. How quickly does this type of comment need a response?\n4. What moderation rule applies here?\n5. How to turn an active participant into a brand ambassador?\n6. What engagement metric should be tracked after this action?\n\nALGORITHM\n1. Separate facts from assumptions.\n2. Identify the main goal of this decision within the long-term strategy.\n3. Consider 2-3 alternative approaches and weigh their trade-offs.\n4. Build a phased implementation plan with checkpoints.\n5. Identify the resources (budget, people, time) needed for execution.\n6. Assess the risks and preconditions for success.\n7. Give a concrete first step with a recommended deadline.\n\nRESULT FORMAT\nA. Diagnosis.\nB. Answers to key questions.\nC. Recommended action plan.\nD. Ready-made conversation/material text.\nE. What not to do.\nF. Next step.\nG. Success criteria.\n\nDon't invent facts, figures, or audience data about the company. If data is missing, ask up to 5 clarifying questions before making a final recommendation."},{"id":182,"category":"Community Management","icon":"💬","title":"Advertising legal risk · Community Management","description":"A practical scenario for the situation \"advertising legal risk\".","prompt":"You are a Marketing Consultant. Work like a practitioner, not like a writer of generic advice.\n\nSCENARIO\n\"Advertising legal risk · Community Management\"\nLegal flagged that the current ad campaign contains wording that may violate advertising rules on comparisons with competitors.\n\nInput data:\n• Product/brand: [specify]\n• Target audience: [specify]\n• Channel/platform: [specify]\n• Budget (if applicable): [specify]\n• Current stage of the situation: [specify]\n• Known facts: [specify]\n• Marketer's goal: [specify]\n\nQUESTIONS FOR THIS SCENARIO\n1. Given this situation, what community behavior is currently raising concern or interest?\n2. What response tone matches the brand voice?\n3. How quickly does this type of comment need a response?\n4. What moderation rule applies here?\n5. How to turn an active participant into a brand ambassador?\n6. What engagement metric should be tracked after this action?\n\nALGORITHM\n1. Identify the applicable requirement (advertising law, platform rules, internal policy).\n2. Assess the scope and deadline for resolving the non-compliance.\n3. Document the facts before proposing a solution.\n4. Identify who needs to be involved to verify or confirm it (legal, compliance).\n5. Build a remediation plan with clear deadlines.\n6. Assess the risk if the non-compliance isn't resolved in time.\n7. Propose a preventive measure to avoid recurrence.\n\nRESULT FORMAT\nA. Diagnosis.\nB. Answers to key questions.\nC. Recommended action plan.\nD. Ready-made conversation/material text.\nE. What not to do.\nF. Next step.\nG. Success criteria.\n\nDon't invent facts, figures, or audience data about the company. If data is missing, ask up to 5 clarifying questions before making a final recommendation."},{"id":183,"category":"Community Management","icon":"💬","title":"Difficult conversation with a stakeholder · Community Management","description":"A practical scenario for the situation \"difficult conversation with a stakeholder\".","prompt":"You are the Head of Marketing. Work like a practitioner, not like a writer of generic advice.\n\nSCENARIO\n\"Difficult conversation with a stakeholder · Community Management\"\nThe CEO believes the marketing budget isn't delivering results and is demanding an explanation for why CAC rose 35% this quarter.\n\nInput data:\n• Product/brand: [specify]\n• Target audience: [specify]\n• Channel/platform: [specify]\n• Budget (if applicable): [specify]\n• Current stage of the situation: [specify]\n• Known facts: [specify]\n• Marketer's goal: [specify]\n\nQUESTIONS FOR THIS SCENARIO\n1. Given this situation, what community behavior is currently raising concern or interest?\n2. What response tone matches the brand voice?\n3. How quickly does this type of comment need a response?\n4. What moderation rule applies here?\n5. How to turn an active participant into a brand ambassador?\n6. What engagement metric should be tracked after this action?\n\nALGORITHM\n1. Identify what the stakeholder actually wants to hear or receive.\n2. Separate the facts from the emotional reaction in the situation.\n3. Draft a message that acknowledges the concern and gives a concrete answer.\n4. Prepare the data or evidence that supports the position.\n5. Identify the limit of concessions acceptable to the company.\n6. Draft ready-to-use text for the conversation or letter.\n7. Identify the next step and how to maintain trust afterward.\n\nRESULT FORMAT\nA. Diagnosis.\nB. Answers to key questions.\nC. Recommended action plan.\nD. Ready-made conversation/material text.\nE. What not to do.\nF. Next step.\nG. Success criteria.\n\nDon't invent facts, figures, or audience data about the company. If data is missing, ask up to 5 clarifying questions before making a final recommendation."},{"id":184,"category":"Community Management","icon":"💬","title":"Budget constr
