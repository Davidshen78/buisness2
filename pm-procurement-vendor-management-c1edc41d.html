<script>const CAT_DATA = {"uk":[{"id":181,"category":"Постачальники та контракти","icon":"📑","title":"Розробка статуту проєкту · Постачальники та контракти","description":"Практичний сценарій для ситуації «розробка статуту проєкту».","prompt":"Ти — керівник проєкту. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Розробка статуту проєкту · Постачальники та контракти»\nСпонсор проєкту хоче запустити новий внутрішній інструмент за 4 місяці, але статуту проєкту досі немає, а межі відповідальності між відділами не визначені.\n\nВхідні дані:\n• Проєкт/продукт: [вкажіть]\n• Розмір команди: [вкажіть]\n• Методологія (Waterfall/Agile/гібрид): [вкажіть]\n• Бюджет чи строк (якщо застосовно): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета керівника проєкту: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, які умови контракту найбільш ризикові?\n2. Який показник ефективності підрядника (SLA) не виконується?\n3. Яка процедура ескалації з підрядником?\n4. Який штраф чи компенсація передбачені договором?\n5. Хто відповідає за керування цими відносинами?\n6. Яка альтернатива, якщо підрядник не виправить ситуацію?\n\nАЛГОРИТМ\n1. Відокрем факти від припущень.\n2. Визнач головну мету цього рішення в контексті довгострокової стратегії проєкту.\n3. Розглянь 2-3 альтернативні підходи та оціни їх компроміси.\n4. Побудуй поетапний план впровадження з контрольними точками.\n5. Визнач ресурси (бюджет, люди, час), потрібні для реалізації.\n6. Оціни ризики та передумови успіху.\n7. Дай конкретний перший крок із рекомендованим строком.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/документа.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи дані про проєкт і команду. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":182,"category":"Постачальники та контракти","icon":"📑","title":"Комплаєнс-ризик · Постачальники та контракти","description":"Практичний сценарій для ситуації «комплаєнс-ризик».","prompt":"Ти — програмний менеджер. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Комплаєнс-ризик · Постачальники та контракти»\nАудит виявив, що проєкт обробляє персональні дані користувачів без формальної оцінки впливу на приватність (DPIA), а реліз заплановано за 3 тижні.\n\nВхідні дані:\n• Проєкт/продукт: [вкажіть]\n• Розмір команди: [вкажіть]\n• Методологія (Waterfall/Agile/гібрид): [вкажіть]\n• Бюджет чи строк (якщо застосовно): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета керівника проєкту: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, які умови контракту найбільш ризикові?\n2. Який показник ефективності підрядника (SLA) не виконується?\n3. Яка процедура ескалації з підрядником?\n4. Який штраф чи компенсація передбачені договором?\n5. Хто відповідає за керування цими відносинами?\n6. Яка альтернатива, якщо підрядник не виправить ситуацію?\n\nАЛГОРИТМ\n1. Визнач застосовну вимогу (стандарт управління проєктами, контракт, внутрішня політика).\n2. Оціни масштаб та строк усунення невідповідності.\n3. Задокументуй факти до того, як пропонувати рішення.\n4. Визнач, хто має бути залучений для перевірки чи підтвердження (юрист, PMO).\n5. Сформуй план усунення з чіткими строками.\n6. Оціни ризик, якщо невідповідність не буде усунена вчасно.\n7. Запропонуй превентивний захід, щоб уникнути повторення.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/документа.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи дані про проєкт і команду. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":183,"category":"Постачальники та контракти","icon":"📑","title":"Складна розмова зі стейкхолдером · Постачальники та контракти","description":"Практичний сценарій для ситуації «складна розмова зі стейкхолдером».","prompt":"Ти — Scrum-майстер. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Складна розмова зі стейкхолдером · Постачальники та контракти»\nСпонсор проєкту невдоволений тим, що дата запуску зсунулась на 6 тижнів, і вимагає пояснень на завтрашній зустрічі з керівництвом.\n\nВхідні дані:\n• Проєкт/продукт: [вкажіть]\n• Розмір команди: [вкажіть]\n• Методологія (Waterfall/Agile/гібрид): [вкажіть]\n• Бюджет чи строк (якщо застосовно): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета керівника проєкту: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, які умови контракту найбільш ризикові?\n2. Який показник ефективності підрядника (SLA) не виконується?\n3. Яка процедура ескалації з підрядником?\n4. Який штраф чи компенсація передбачені договором?\n5. Хто відповідає за керування цими відносинами?\n6. Яка альтернатива, якщо підрядник не виправить ситуацію?\n\nАЛГОРИТМ\n1. Визнач, що стейкхолдер насправді хоче почути чи отримати.\n2. Відокрем факти від емоційної реакції в ситуації.\n3. Сформуй повідомлення, яке визнає стурбованість і дає конкретну відповідь.\n4. Підготуй дані чи докази, що підтверджують позицію.\n5. Визнач межу поступок, прийнятну для проєкту.\n6. Сформуй готовий текст для розмови чи листа.\n7. Визнач наступний крок і спосіб підтримати довіру після розмови.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/документа.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи дані про проєкт і команду. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":184,"category":"Постачальники та контракти","icon":"📑","title":"Бюджетне обмеження · Постачальники та контракти","description":"Практичний сценарій для ситуації «бюджетне обмеження».","prompt":"Ти — PMO-консультант. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Бюджетне обмеження · Постачальники та контракти»\nПроєктний бюджет вичерпано на 85% при виконанні лише 60% обсягу робіт, а до завершення залишилось 2 місяці.\n\nВхідні дані:\n• Проєкт/продукт: [вкажіть]\n• Розмір команди: [вкажіть]\n• Методологія (Waterfall/Agile/гібрид): [вкажіть]\n• Бюджет чи строк (якщо застосовно): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета керівника проєкту: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, які умови контракту найбільш ризикові?\n2. Який показник ефективності підрядника (SLA) не виконується?\n3. Яка процедура ескалації з підрядником?\n4. Який штраф чи компенсація передбачені договором?\n5. Хто відповідає за керування цими відносинами?\n6. Яка альтернатива, якщо підрядник не виправить ситуацію?\n\nАЛГОРИТМ\n1. Зафіксуй точні цифри ситуації — суми, дати, терміни.\n2. Визнач мінімально необхідну дію для стабілізації протягом 24-48 годин.\n3. Оціни, кого потрібно негайно поінформувати.\n4. Визнач тимчасові заходи, які можна скасувати після стабілізації.\n5. Сформуй короткий план дій без зайвих деталей.\n6. Визнач, який показник підтвердить, що криза минула.\n7. Заплануй розбір ситуації після стабілізації, щоб запобігти повторенню.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/документа.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи дані про проєкт і команду. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":185,"category":"Постачальники та контракти","icon":"📑","title":"Впровадження нового процесу · Постачальники та контракти","description":"Практичний сценарій для ситуації «впровадження нового процесу».","prompt":"Ти — керівник проєкту. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Впровадження нового процесу · Постачальники та контракти»\nКоманда переходить з Waterfall на Scrum, і перший спринт має початися за 2 тижні, хоча ніхто в команді раніше не працював за Agile.\n\nВхідні дані:\n• Проєкт/продукт: [вкажіть]\n• Розмір команди: [вкажіть]\n• Методологія (Waterfall/Agile/гібрид): [вкажіть]\n• Бюджет чи строк (якщо застосовно): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета керівника проєкту: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, які умови контракту найбільш ризикові?\n2. Який показник ефективності підрядника (SLA) не виконується?\n3. Яка процедура ескалації з підрядником?\n4. Який штраф чи компенсація передбачені договором?\n5. Хто відповідає за керування цими відносинами?\n6. Яка альтернатива, якщо підрядник не виправить ситуацію?\n\nАЛГОРИТМ\n1. Відокрем факти від припущень.\n2. Визнач головну мету цього рішення в контексті довгострокової стратегії проєкту.\n3. Розглянь 2-3 альтернативні підходи та оціни їх компроміси.\n4. Побудуй поетапний план впровадження з контрольними точками.\n5. Визнач ресурси (бюджет, люди, час), потрібні для реалізації.\n6. Оціни ризики та передумови успіху.\n7. Дай конкретний перший крок із рекомендованим строком.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/документа.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи дані про проєкт і команду. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":186,"category":"Постачальники та контракти","icon":"📑","title":"Потреба в інструменті управління · Постачальники та контракти","description":"Практичний сценарій для ситуації «потреба в інструменті управління».","prompt":"Ти — програмний менеджер. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Потреба в інструменті управління · Постачальники та контракти»\nСтатус проєкту зара оєкту.\n3. Розглянь 2-3 альтернативні підходи та оціни їх компроміси.\n4. Побудуй поетапний план впровадження з контрольними точками.\n5. Визнач ресурси (бюджет, люди, час), потрібні для реалізації.\n6. Оціни ризики та передумови успіху.\n7. Дай конкретний перший крок із рекомендованим строком.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/документа.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи дані про проєкт і команду. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":196,"category":"Постачальники та контракти","icon":"📑","title":"Оптимізація ресурсів · Постачальники та контракти","description":"Практичний сценарій для ситуації «оптимізація ресурсів».","prompt":"Ти — PMO-консультант. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Оптимізація ресурсів · Постачальники та контракти»\nДва паралельні проєкти конкурують за одного й того самого фахівця з DevOps, і обидва керівники проєктів вважають свій пріоритетним.\n\nВхідні дані:\n• Проєкт/продукт: [вкажіть]\n• Розмір команди: [вкажіть]\n• Методологія (Waterfall/Agile/гібрид): [вкажіть]\n• Бюджет чи строк (якщо застосовно): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета керівника проєкту: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, які умови контракту найбільш ризикові?\n2. Який показник ефективності підрядника (SLA) не виконується?\n3. Яка процедура ескалації з підрядником?\n4. Який штраф чи компенсація передбачені договором?\n5. Хто відповідає за керування цими відносинами?\n6. Яка альтернатива, якщо підрядник не виправить ситуацію?\n\nАЛГОРИТМ\n1. Визнач, які дані підтверджують чи спростовують проблему.\n2. Розклади показник на складові частини, щоб знайти джерело відхилення.\n3. Порівняй поточні дані з історичними чи галузевими бенчмарками.\n4. Сформулюй 2-3 гіпотези щодо причини та перевір кожну.\n5. Визнач, яка гіпотеза найкраще пояснює дані.\n6. Запропонуй конкретну дію на основі підтвердженої причини.\n7. Визнач, який показник відстежувати, щоб підтвердити ефект дії.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/документа.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи дані про проєкт і команду. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":197,"category":"Постачальники та контракти","icon":"📑","title":"Планування релізу чи спринту · Постачальники та контракти","description":"Практичний сценарій для ситуації «планування релізу чи спринту».","prompt":"Ти — керівник проєкту. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Планування релізу чи спринту · Постачальники та контракти»\nНаступний реліз має включати 45 сторі-поінтів роботи, але команда за останні 3 спринти в середньому закривала лише 30.\n\nВхідні дані:\n• Проєкт/продукт: [вкажіть]\n• Розмір команди: [вкажіть]\n• Методологія (Waterfall/Agile/гібрид): [вкажіть]\n• Бюджет чи строк (якщо застосовно): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета керівника проєкту: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, які умови контракту найбільш ризикові?\n2. Який показник ефективності підрядника (SLA) не виконується?\n3. Яка процедура ескалації з підрядником?\n4. Який штраф чи компенсація передбачені договором?\n5. Хто відповідає за керування цими відносинами?\n6. Яка альтернатива, якщо підрядник не виправить ситуацію?\n\nАЛГОРИТМ\n1. Відокрем факти від припущень.\n2. Визнач головну мету цього рішення в контексті довгострокової стратегії проєкту.\n3. Розглянь 2-3 альтернативні підходи та оціни їх компроміси.\n4. Побудуй поетапний план впровадження з контрольними точками.\n5. Визнач ресурси (бюджет, люди, час), потрібні для реалізації.\n6. Оціни ризики та передумови успіху.\n7. Дай конкретний перший крок із рекомендованим строком.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/документа.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи дані про проєкт і команду. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":198,"category":"Постачальники та контракти","icon":"📑","title":"Компроміс обсягу і строків · Постачальники та контракти","description":"Практичний сценарій для ситуації «компроміс обсягу і строків».","prompt":"Ти — програмний менеджер. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Компроміс обсягу і строків · Постачальники та контракти»\nЩоб встигнути до фіксованої дати запуску заходу, потрібно або скоротити обсяг на 20%, або перенести дату на 3 тижні.\n\nВхідні дані:\n• Проєкт/продукт: [вкажіть]\n• Розмір команди: [вкажіть]\n• Методологія (Waterfall/Agile/гібрид): [вкажіть]\n• Бюджет чи строк (якщо застосовно): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета керівника проєкту: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, які умови контракту найбільш ризикові?\n2. Який показник ефективності підрядника (SLA) не виконується?\n3. Яка процедура ескалації з підрядником?\n4. Який штраф чи компенсація передбачені договором?\n5. Хто відповідає за керування цими відносинами?\n6. Яка альтернатива, якщо підрядник не виправить ситуацію?\n\nАЛГОРИТМ\n1. Визнач, які дані підтверджують чи спростовують проблему.\n2. Розклади показник на складові частини, щоб знайти джерело відхилення.\n3. Порівняй поточні дані з історичними чи галузевими бенчмарками.\n4. Сформулюй 2-3 гіпотези щодо причини та перевір кожну.\n5. Визнач, яка гіпотеза найкраще пояснює дані.\n6. Запропонуй конкретну дію на основі підтвердженої причини.\n7. Визнач, який показник відстежувати, щоб підтвердити ефект дії.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/документа.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи дані про проєкт і команду. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":199,"category":"Постачальники та контракти","icon":"📑","title":"Міжкомандна координація · Постачальники та контракти","description":"Практичний сценарій для ситуації «міжкомандна координація».","prompt":"Ти — Scrum-майстер. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Міжкомандна координація · Постачальники та контракти»\nКоманда бекенду завершила API на тиждень раніше плану, а команда фронтенду досі не готова його інтегрувати через паралельну роботу над іншою задачею.\n\nВхідні дані:\n• Проєкт/продукт: [вкажіть]\n• Розмір команди: [вкажіть]\n• Методологія (Waterfall/Agile/гібрид): [вкажіть]\n• Бюджет чи строк (якщо застосовно): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета керівника проєкту: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, які умови контракту найбільш ризикові?\n2. Який показник ефективності підрядника (SLA) не виконується?\n3. Яка процедура ескалації з підрядником?\n4. Який штраф чи компенсація передбачені договором?\n5. Хто відповідає за керування цими відносинами?\n6. Яка альтернатива, якщо підрядник не виправить ситуацію?\n\nАЛГОРИТМ\n1. Визнач, що стейкхолдер насправді хоче почути чи отримати.\n2. Відокрем факти від емоційної реакції в ситуації.\n3. Сформуй повідомлення, яке визнає стурбованість і дає конкретну відповідь.\n4. Підготуй дані чи докази, що підтверджують позицію.\n5. Визнач межу поступок, прийнятну для проєкту.\n6. Сформуй готовий текст для розмови чи листа.\n7. Визнач наступний крок і спосіб підтримати довіру після розмови.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/документа.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи дані про проєкт і команду. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":200,"category":"Постачальники та контракти","icon":"📑","title":"Ретроспектива і вдосконалення · Постачальники та контракти","description":"Практичний сценарій для ситуації «ретроспектива і вдосконалення».","prompt":"Ти — PMO-консультант. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Ретроспектива і вдосконалення · Постачальники та контракти»\nОстанні три ретроспективи виявили одну й ту саму проблему (нечіткі вимоги від продукт-менеджера), але жодних змін досі не впроваджено.\n\nВхідні дані:\n• Проєкт/продукт: [вкажіть]\n• Розмір команди: [вкажіть]\n• Методологія (Waterfall/Agile/гібрид): [вкажіть]\n• Бюджет чи строк (якщо застосовно): [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета керівника проєкту: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, які умови контракту найбільш ризикові?\n2. Який показник ефективності підрядника (SLA) не виконується?\n3. Яка процедура ескалації з підрядником?\n4. Який штраф чи компенсація передбачені договором?\n5. Хто відповідає за керування цими відносинами?\n6. Яка альтернатива, якщо підрядник не виправить ситуацію?\n\nАЛГОРИТМ\n1. Визнач, які дані підтверджують чи спростовують проблему.\n2. Розклади показник на складові частини, щоб знайти джерело відхилення.\n3. Порівняй поточні дані з історичними чи галузевими бенчмарками.\n4. Сформулюй 2-3 гіпотези щодо причини та перевір кожну.\n5. Визнач, яка гіпотеза найкраще пояснює дані.\n6. Запропонуй конкретну дію на основі підтвердженої причини.\n7. Визнач, який показник відстежувати, щоб підтвердити ефект дії.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/документа.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи дані про проєкт і команду. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."}],"en":[{"id":181,"category":"Procurement & Vendor Management","icon":"📑","title":"Project charter drafting · Procurement & Vendor Management","description":"A practical scenario for the situation \"project charter drafting\".","prompt":"You are a Project Manager. Work like a practitioner, not like a writer of generic advice.\n\nSCENARIO\n\"Project charter drafting · Procurement & Vendor Management\"\nThe project sponsor wants to launch a new internal tool in 4 months, but there's still no project charter, and responsibility boundaries between departments are undefined.\n\nInput data:\n• Project/product: [specify]\n• Team size: [specify]\n• Methodology (Waterfall/Agile/hybrid): [specify]\n• Budget or timeline (if applicable): [specify]\n• Current stage of the situation: [specify]\n• Known facts: [specify]\n• Project manager's goal: [specify]\n\nQUESTIONS FOR THIS SCENARIO\n1. Given this situation, what contract terms are riskiest?\n2. What contractor performance metric (SLA) is not being met?\n3. What is the escalation procedure with the vendor?\n4. What penalty or compensation does the contract provide for?\n5. Who is responsible for managing this relationship?\n6. What alternative exists if the vendor doesn't fix the situation?\n\nALGORITHM\n1. Separate facts from assumptions.\n2. Identify the main goal of this decision within the project's long-term strategy.\n3. Consider 2-3 alternative approaches and weigh their trade-offs.\n4. Build a phased implementation plan with checkpoints.\n5. Identify the resources (budget, people, time) needed for execution.\n6. Assess the risks and preconditions for success.\n7. Give a concrete first step with a recommended deadline.\n\nRESULT FORMAT\nA. Diagnosis.\nB. Answers to key questions.\nC. Recommended action plan.\nD. Ready-made conversation/document text.\nE. What not to do.\nF. Next step.\nG. Success criteria.\n\nDon't invent facts, figures, or data about the project and team. If data is missing, ask up to 5 clarifying questions before making a final recommendation."},{"id":182,"category":"Procurement & Vendor Management","icon":"📑","title":"Compliance risk · Procurement & Vendor Management","description":"A practical scenario for the situation \"compliance risk\".","prompt":"You are a Program Manager. Work like a practitioner, not like a writer of generic advice.\n\nSCENARIO\n\"Compliance risk · Procurement & Vendor Management\"\nAn audit found the project processes user personal data without a formal privacy impact assessment (DPIA), and the release is planned in 3 weeks.\n\nInput data:\n• Project/product: [specify]\n• Team size: [specify]\n• Methodology (Waterfall/Agile/hybrid): [specify]\n• Budget or timeline (if applicable): [specify]\n• Current stage of the situation: [specify]\n• Known facts: [specify]\n• Project manager's goal: [specify]\n\nQUESTIONS FOR THIS SCENARIO\n1. Given this situation, what contract terms are riskiest?\n2. What contractor performance metric (SLA) is not being met?\n3. What is the escalation procedure with the vendor?\n4. What penalty or compensation does the contract provide for?\n5. Who is responsible for managing this relationship?\n6. What alternative exists if the vendor doesn't fix the situation?\n\nALGORITHM\n1. Identify the applicable requirement (project management standard, contract, internal policy).\n2. Assess the scope and deadline for resolving the non-compliance.\n3. Document the facts before proposing a solution.\n4. Identify who needs to be involved to verify or confirm it (legal, PMO).\n5. Build a remediation plan with clear deadlines.\n6. Assess the risk if the non-compliance isn't resolved in time.\n7. Propose a preventive measure to avoid recurrence.\n\nRESULT FORMAT\nA. Diagnosis.\nB. Answers to key questions.\nC. Recommended action plan.\nD. Ready-made conversation/document text.\nE. What not to do.\nF. Next step.\nG. Success criteria.\n\nDon't invent facts, figures, or data about the project and team. If data is missing, ask up to 5 clarifying questions before making a final recommendation."},{"id":183,"category":"Procurement & Vendor Management","icon":"📑","title":"Difficult conversation with a stakeholder · Procurement & Vendor Management","description":"A practical scenario for the situation \"difficult conversation with a stakeholder\".","prompt":"You are a Scrum Master. Work like a practitioner, not like a writer of generic advice.\n\nSCENARIO\n\"Difficult conversation with a stakeholder · Procurement & Vendor Management\"\nThe project sponsor is unhappy that the launch date slipped by 6 weeks and is demanding an explanation at tomorrow's leadership meeting.\n\nInput data:\n• Project/product: [specify]\n• Team size: [specify]\n• Methodology (Waterfall/Agile/hybrid): [specify]\n• Budget or timeline (if applicable): [specify]\n• Current stage of the situation: [specify]\n• Known facts: [specify]\n• Project manager's goal: [specify]\n\nQUESTIONS FOR THIS SCENARIO\n1. Given this situation, what contract terms are riskiest?\n2. What contractor performance metric (SLA) is not being met?\n3. What is the escalation procedure with the vendor?\n4. What penalty or compensation does the contract provide for?\n5. Who is responsible for managing this relationship?\n6. What alternative exists if the vendor doesn't fix the situation?\n\nALGORITHM\n1. Identify what the stakeholder actually wants to hear or receive.\n2. Separate the facts from the emotional reaction in the situation.\n3. Draft a message that acknowledges the concern and gives a concrete answer.\n4. Prepare the data or evidence that supports the position.\n5. Identify the limit of concessions acceptable for the project.\n6. Draft ready-to-use text for the conversation or letter.\n7. Identify the ry benchmarks.\n4. Formulate 2-3 hypotheses about the cause and test each one.\n5. Determine which hypothesis best explains the data.\n6. Propose a concrete action based on the confirmed cause.\n7. Identify the metric to track to confirm the action's effect.\n\nRESULT FORMAT\nA. Diagnosis.\nB. Answers to key questions.\nC. Recommended action plan.\nD. Ready-made conversation/document text.\nE. What not to do.\nF. Next step.\nG. Success criteria.\n\nDon't invent facts, figures, or data about the project and team. If data is missing, ask up to 5 clarifying questions before making a final recommendation."}],"es":[{"id":181,"category":"Adquisiciones y gestión de proveedores","icon":"📑","title":"Redacción del acta del proyecto · Adquisiciones y gestión de proveedores","description":"Escenario práctico para la situación «redacción del acta del proyecto».","prompt":"Eres Director de Proyecto. Trabaja como un profesional práctico, no como alguien que da consejos genéricos.\n\nESCENARIO\n\"Redacción del acta del proyecto · Adquisiciones y gestión de proveedores\"\nEl patrocinador del proyecto quiere lanzar una nueva herramienta interna en 4 meses, pero todavía no existe un acta de proyecto y los límites de responsabilidad entre departamentos no están definidos.\n\nDatos de entrada:\n• Proyecto/producto: [indicar]\n• Tamaño del equipo: [indicar]\n• Metodología (Waterfall/Ágil/híbrida): [indicar]\n• Presupuesto o plazo (si corresponde): [indicar]\n• Etapa actual de la situación: [indicar]\n• Hechos conocidos: [indicar]\n• Objetivo del director de proyecto: [indicar]\n\nPREGUNTAS PARA ESTE ESCENARIO\n1. Dada esta situación, ¿Qué condiciones contractuales son más riesgosas?\n2. ¿Qué indicador de desempeño del proveedor (SLA) no se está cumpliendo?\n3. ¿Cuál es el procedimiento de escalación con el proveedor?\n4. ¿Qué penalización o compensación prevé el contrato?\n5. ¿Quién es responsable de gestionar esta relación?\n6. ¿Qué alternativa existe si el proveedor no corrige la situación?\n\nALGORITMO\n1. Separa los hechos de las suposiciones.\n2. Identifica el objetivo principal de esta decisión dentro de la estrategia a largo plazo del proyecto.\n3. Considera 2-3 enfoques alternativos y evalúa sus compromisos.\n4. Construye un plan de implementación por fases con puntos de control.\n5. Identifica los recursos (presupuesto, personas, tiempo) necesarios para ejecutarlo.\n6. Evalúa los riesgos y las condiciones previas para el éxito.\n7. Da un primer paso concreto con un plazo recomendado.\n\nFORMATO DEL RESULTADO\nA. Diagnóstico.\nB. Respuestas a las preguntas clave.\nC. Plan de acción recomendado.\nD. Texto listo para la conversación/documento.\nE. Qué no hacer.\nF. Siguiente paso.\nG. Criterio de éxito.\n\nNo inventes hechos, cifras ni datos sobre el proyecto y el equipo. Si faltan datos, haz hasta 5 preguntas aclaratorias antes de dar una recomendación final."},{"id":182,"category":"Adquisiciones y gestión de proveedores","icon":"📑","title":"Riesgo de cumplimiento · Adquisiciones y gestión de proveedores","description":"Escenario práctico para la situación «riesgo de cumplimiento».","prompt":"Eres Gerente de Programa. Trabaja como un profesional práctico, no como alguien que da consejos genéricos.\n\nESCENARIO\n\"Riesgo de cumplimiento · Adquisiciones y gestión de proveedores\"\nUna auditoría reveló que el proyecto procesa datos personales de los usuarios sin una evaluación formal de impacto en la privacidad (DPIA), y el lanzamiento está previsto en 3 semanas.\n\nDatos de entrada:\n• Proyecto/producto: [indicar]\n• Tamaño del equipo: [indicar]\n• Metodología (Waterfall/Ágil/híbrida): [indicar]\n• Presupuesto o plazo (si corresponde): [indicar]\n• Etapa actual de la situación: [indicar]\n• Hechos conocidos: [indicar]\n• Objetivo del director de proyecto: [indicar]\n\nPREGUNTAS PARA ESTE ESCENARIO\n1. Dada esta situación, ¿Qué condiciones contractuales son más riesgosas?\n2. ¿Qué indicador de desempeño del proveedor (SLA) no se está cumpliendo?\n3. ¿Cuál es el procedimiento de escalación con el proveedor?\n4. ¿Qué penalización o compensación prevé el contrato?\n5. ¿Quién es responsable de gestionar esta relación?\n6. ¿Qué alternativa existe si el proveedor no corrige la situación?\n\nALGORITMO\n1. Identifica el requisito aplicable (estándar de gestión de proyectos, contrato, política interna).\n2. Evalúa el alcance y el plazo para resolver el incumplimiento.\n3. Documenta los hechos antes de proponer una solución.\n4. Identifica a quién hay que involucrar para verificarlo o confirmarlo (legal, PMO).\n5. Elabora un plan de corrección con plazos claros.\n6. Evalúa el riesgo si el incumplimiento no se resuelve a tiempo.\n7. Propón una medida preventiva para evitar que se repita.\n\nFORMATO DEL RESULTADO\nA. Diagnóstico.\nB. Respuestas a las preguntas clave.\nC. Plan de acción recomendado.\nD. Texto listo para la conversación/documento.\nE. Qué no hacer.\nF. Siguiente paso.\nG. Criterio de éxito.\n\nNo inventes hechos, cifras ni datos sobre el proyecto y el equipo. Si faltan datos, haz hasta 5 preguntas aclaratorias antes de dar una recomendación final."},{"id":183,"category":"Adquisiciones y gestión de proveedores","icon":"📑","title":"Conversación difícil con una parte interesada · Adquisiciones y gestión de proveedores","description":"Escenario práctico para la situación «conversación difícil con una parte interesada».","prompt":"Eres Scrum Master. Trabaja como un profesional práctico, no como alguien que da consejos genéricos.\n\nESCENARIO\n\"Conversación difícil con una parte interesada · Adquisiciones y gestión de proveedores\"\nEl patrocinador del proyecto está descontento porque la fecha de lanzamiento se ha retrasado 6 semanas y exige explicaciones en la reunión de dirección de mañana.\n\nDatos de entrada:\n• Proyecto/producto: [indicar]\n• Tamaño del equipo: [indicar]\n• Metodología (Waterfall/Ágil/híbrida): [indicar]\n• Presupuesto o plazo (si corresponde): [indicar]\n• Etapa actual de la situación: [indicar]\n• Hechos conocidos: [indicar]\n• Objetivo del director de proyecto: [indicar]\n\nPREGUNTAS PARA ESTE ESCENARIO\n1. Dada esta situación, ¿Qué condiciones contractuales son más riesgosas?\n2. ¿Qué indicador de desempeño del proveedor (SLA) no se está cumpliendo?\n3. ¿Cuál es el procedimiento de escalación con el proveedor?\n4. ¿Qué penalización o compensación prevé el contrato?\n5. ¿Quién es responsable de gestionar esta relación?\n6. ¿Qué alternativa existe si el proveedor no corrige la situación?\n\nALGORITMO\n1. Identifica qué es lo que la parte interesada realmente quiere oír o recibir.\n2. Separa los hechos de la reacción emocional en la situación.\n3. Redacta un mensaje que reconozca la preocupación y dé una respuesta concreta.\n4. Prepara los datos o pruebas que respaldan la posición.\n5. Identifica el límite de concesiones aceptable para el proyecto.\n6. Redacta un texto listo para usar en la conversación o la carta.\n7. Identifica el siguiente paso y cómo mantener la confianza después.\n\nFORMATO DEL RESULTADO\nA. Diagnóstico.\nB. Respuestas a las preguntas clave.\nC. Plan de acción recomendado.\nD. Texto listo para la conversación/documento.\nE. Qué no hacer.\nF. Siguiente paso.\nG. Criterio de éxito.\n\nNo inventes hechos, cifras ni datos sobre el proyecto y el equipo. Si faltan datos, haz hasta 5 preguntas aclaratorias antes de dar una recomendación final."},{"id":184,"category":"Adquisiciones y gestión de proveedores","icon":"📑","title":"Restricción presupuestaria · Adquisiciones y gestión de proveedores","description":"Escenario práctico para la situación «restricción presupuestaria».","prompt":"Eres Consultor de PMO. Trabaja como un profesional práctico, no como alguien que da consejos genéricos.\n\nESCENARIO\n\"Restricción presupuestaria · Adquisiciones y gestión de proveedores\"\nEl presupuesto del proyecto se ha consumido en un 85% mientras solo se ha completado el 60% del alcance, y quedan 2 meses para el plazo final.\n\nDatos de entrad
